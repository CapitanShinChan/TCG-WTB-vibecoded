<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Card Inventory{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>window.APP_DEBUG = {{ app_debug | tojson }};</script>
  <script src="/static/debug.js"></script>
</head>
<body>
  <dialog id="progress" class="progress-dialog" aria-labelledby="progress-title" aria-describedby="progress-description">
    <div class="progress-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 7v5h-5M4 17v-5h5" />
        <path d="M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3A7 7 0 0 0 17.9 17" />
      </svg>
    </div>
    <p class="progress-eyebrow">PLEASE WAIT</p>
    <h2 id="progress-title" tabindex="-1" autofocus>Updating prices</h2>
    <p id="progress-description">Fetching the latest market prices for your cards.</p>
    <div class="progress-meta">
      <span id="progress-label" role="status" aria-live="polite">Connecting…</span>
      <span id="progress-percent" aria-hidden="true">—</span>
    </div>
    <div id="progress-track" class="progress-track" role="progressbar" aria-labelledby="progress-title" aria-valuemin="0" aria-valuemax="100">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <p class="progress-note">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10" width="14" height="11" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg>
      Controls are paused while this runs
    </p>
  </dialog>
  <header class="topbar">
    <a class="brand" href="/">🃏 Card Inventory</a>
    <nav>
      <a href="/">Search</a>
      <a href="/import">Import</a>
      <a href="/buylist">Buylist</a>
      <a href="/lists">Lists</a>
      <a href="/export">Export</a>
    </nav>
  </header>
  <main>
    <p id="catalogue-warning" class="warn-banner hidden" role="status"></p>
    <p id="price-refresh-error" class="warn-banner hidden" role="alert"></p>
    <p id="buylist-action-error" class="warn-banner hidden" role="alert"></p>
    {% block content %}{% endblock %}
  </main>

  <!-- shared recent-sales modal (used by the buylist suggested price) -->
  <div id="sales-modal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" data-close-sales>&times;</button>
      <h2 id="sales-modal-title"></h2>
      <div id="sales-modal-body"></div>
    </div>
  </div>

  <!-- Native dialog keeps keyboard focus inside the enlarged card preview. -->
  <dialog id="card-preview" aria-labelledby="card-preview-title">
    <figure>
      <button type="button" class="card-preview-close" aria-label="Close card preview" autofocus>&times;</button>
      <img id="card-preview-image" alt="">
      <figcaption id="card-preview-title"></figcaption>
    </figure>
  </dialog>

  {% include "_buylist_editor.html" %}

  <script src="/static/card-preview.js"></script>
  <script src="/static/catalogue.js"></script>
  {% block scripts %}{% endblock %}
  <script src="/static/buylist.js"></script>
  <script src="/static/buylist-management.js"></script>
</body>
</html>
